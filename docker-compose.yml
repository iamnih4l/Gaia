version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaia-ai:latest
    container_name: gaia-api
    ports:
      - "8000:8000"
    environment:
      - HYDRA_FULL_ERROR=1
      - LOG_LEVEL=INFO
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: gaia-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/artifacts
      - mlflow_db:/mlflow.db
    restart: unless-stopped

  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: gaia-tensorboard
    ports:
      - "6006:6006"
    command: tensorboard --logdir=/app/logs --host=0.0.0.0 --port=6006
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  mlflow_data:
  mlflow_db:
