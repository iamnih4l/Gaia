# ============================================================================
# LSTM Configuration
# ============================================================================

name: "lstm"
type: "lstm"
description: "Stacked LSTM with attention mechanism for climate time series"

architecture:
  input_dim: 7
  hidden_dim: 256
  n_layers: 3
  dropout: 0.2
  bidirectional: false
  attention: true
  attention_dim: 128
  output_dim: 1
  pool_strategy: "attention"  # attention | last | mean

uncertainty:
  mc_dropout: true
  mc_samples: 50
  dropout_rate: 0.2
