# ============================================================================
# GRU Configuration
# ============================================================================

name: "gru"
type: "gru"
description: "Stacked GRU network for climate time series classification"

architecture:
  input_dim: 7
  hidden_dim: 256
  n_layers: 3
  dropout: 0.2
  bidirectional: false
  attention: true
  attention_dim: 128
  output_dim: 1
  pool_strategy: "attention"

uncertainty:
  mc_dropout: true
  mc_samples: 50
  dropout_rate: 0.2
