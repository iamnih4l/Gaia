# ============================================================================
# NOAA Coral Reef Watch Dataset Configuration
# ============================================================================

name: "coral"
description: "NOAA Coral Reef Watch SST anomalies and Degree Heating Weeks"

source:
  api: "noaa_erddap"
  product: "CRW_v3.1"
  url: "https://coralreefwatch.noaa.gov/product/5km/index_5km_ssta.php"

variables:
  - "analysed_sst"
  - "sst_anomaly"
  - "degree_heating_week"
  - "hotspot"
  - "bleaching_alert_area"

spatial:
  resolution: 0.05  # ~5 km
  reef_regions:
    great_barrier_reef:
      lat_min: -25.0
      lat_max: -10.0
      lon_min: 142.0
      lon_max: 155.0
    caribbean:
      lat_min: 10.0
      lat_max: 30.0
      lon_min: -90.0
      lon_max: -60.0
    coral_triangle:
      lat_min: -10.0
      lat_max: 15.0
      lon_min: 95.0
      lon_max: 145.0

temporal:
  start_year: 1985
  end_year: 2024
  frequency: "daily"
  aggregate_to: "weekly"

processing:
  compute_anomalies: false  # SST anomalies already provided
  dhw_threshold: 4.0  # °C-weeks, bleaching threshold
  mass_bleaching_threshold: 8.0
  normalize: true
  normalize_method: "standard"

loader:
  batch_size: 64
  sequence_length: 52  # weeks
  stride: 1
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
