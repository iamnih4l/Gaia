# ============================================================================
# Training Configuration
# ============================================================================

# ─── Optimization ───
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: "cosine_annealing_warm_restarts"
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-7
  warmup_epochs: 5
  warmup_start_lr: 1.0e-7

# ─── Training ───
epochs: 100
batch_size: 32
gradient_clip_val: 1.0
gradient_clip_algorithm: "norm"
accumulate_grad_batches: 1

# ─── Loss ───
loss:
  name: "focal"           # bce | focal | weighted_bce
  gamma: 2.0              # focal loss gamma
  alpha: 0.75             # focal loss alpha (positive class weight)
  label_smoothing: 0.05

# ─── Early Stopping ───
early_stopping:
  enabled: true
  monitor: "val/roc_auc"
  mode: "max"
  patience: 15
  min_delta: 0.001

# ─── Checkpointing ───
checkpointing:
  enabled: true
  monitor: "val/roc_auc"
  mode: "max"
  save_top_k: 3
  save_last: true
  filename: "{epoch:03d}-{val/roc_auc:.4f}"

# ─── Reproducibility ───
reproducibility:
  seed: 42
  deterministic: true
  benchmark: false

# ─── Data Augmentation ───
augmentation:
  noise_std: 0.01
  time_shift_max: 3
  scale_range: [0.95, 1.05]
  dropout_features: 0.05
